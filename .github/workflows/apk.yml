name: APK (arm64-v8a only)

# Sadece arm64-v8a — kullanıcının isteği. Tek APK, hızlı build, doğrudan kurulum için.
# Local build yok — her şey Actions'te. gradlew + app/build.gradle.kts Holy'de var (arm64 filtreli).

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3.13750724
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724" || sdkmanager --install "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties
          cat local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (arm64-v8a, ${{ inputs.variant || 'Release' }})
        run: |
          VARIANT="${{ inputs.variant || 'Release' }}"
          echo "Building $VARIANT for arm64-v8a only (abiFilters arm64-v8a)"
          ./gradlew ":app:assemble${VARIANT}" --stacktrace
          echo "=== outputs ==="
          find app/build/outputs -type f -name "*.apk" | xargs ls -lh 2>&1 | head -n 20
          # arm64 doğrula
          if command -v unzip >/dev/null 2>&1; then
            APK=$(find app/build/outputs -name "*.apk" | head -n1)
            echo "APK: $APK"
            unzip -l "$APK" | grep -E "lib/arm64|lib/arm |lib/x86" | head -n 20 || true
            if unzip -l "$APK" | grep -q "lib/x86\|lib/armeabi-v7a"; then
              echo "::warning::APK contains non-arm64 libs (should be arm64-v8a only) — abiFilters kontrol et"
            fi
            if unzip -l "$APK" | grep -q "lib/arm64-v8a"; then
              echo "✓ arm64-v8a confirmed"
            fi
          fi
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: holy-arm64-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
